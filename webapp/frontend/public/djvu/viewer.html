<!doctype html>
<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link type="text/css" rel="stylesheet" href="Djvu_html5.css">
<title>DjVu Viewer</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #fff;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
</style>
</head>
<body>
    <div id="djvuContainer"></div>
    <script type="text/javascript">
        var urlParams = new URLSearchParams(window.location.search);
        var fileUrl = urlParams.get('url');
        if (fileUrl) {
            document.getElementById('djvuContainer').setAttribute('file', fileUrl);
        }
        var DJVU_CONTEXT = {
            background: "#fff",
            uiHideDelay: 1500,
        };
    </script>
    <script type="text/javascript" language="javascript" src="djvu_html5/djvu_html5.nocache.js"></script>
</body>
</html>
